<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="The four levels" style="width:100%;height:auto;background:#EFEBE1;border:1px solid #D0CABD;border-radius:6px"><style>
text{font-family:'JetBrains Mono',Menlo,monospace;fill:#5F5B52}
.t-ink{fill:#171614}
.cap{font-family:'IBM Plex Sans','IBM Plex Sans Hebrew',sans-serif}
.tag{font-weight:700}
.qm{font-family:'Instrument Serif',Georgia,serif;font-style:italic;fill:#5F5B52}
.k{stroke:#171614;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.kf{stroke:#171614;fill:#EFEBE1;stroke-width:1.6;stroke-linejoin:round}
.inkf{fill:#171614;stroke:#171614;stroke-width:1.6;stroke-linejoin:round}
.inkf0{fill:#171614}
.g{stroke:#B4AEA1;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.gd{stroke:#B4AEA1;fill:none;stroke-width:1.8;stroke-dasharray:6 7;stroke-linecap:round}
.gd2{stroke:#B4AEA1;fill:none;stroke-width:1.2;stroke-dasharray:3 4}
.hatch{stroke:#B4AEA1;stroke-width:1}
.sq{fill:#E6E1D5}
.note{fill:#F2E9C6;stroke:#B4AEA1;stroke-width:1.2}
.yb{stroke:#A88C00;fill:none;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
.y{stroke:#FDD604;fill:none;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
.yd,.dot{fill:#FDD604;stroke:#A88C00;stroke-width:1.6}
.gate,.sign{fill:#EFEBE1;stroke:#171614;stroke-width:1.6}
.gate.unlit{fill:#E6E1D5;stroke:#B4AEA1}
.sign-v{fill:#5F5B52}
.eyebrow{font-family:'JetBrains Mono',Menlo,monospace;font-size:10px;letter-spacing:.4px;fill:#5F5B52}
.cap-label{font-family:'IBM Plex Sans','IBM Plex Sans Hebrew',sans-serif;font-size:12px;fill:#171614}
</style><title>The four levels</title><text x="32" y="34" class="eyebrow">06/06 · THE FOUR LEVELS</text>
<g transform="rotate(-0.5 235 392)">
<rect x="70" y="354" width="330" height="76" rx="6" class="kf"/>
<text x="86" y="380" class="eyebrow" style="font-size:9px">LEVEL 1</text>
<text x="86" y="404" class="cap-label tag" style="font-size:12px">CODE & TEMPLATE REUSE</text>
</g>
<g transform="rotate(0.9 235 298)">
<rect x="70" y="260" width="330" height="76" rx="6" class="kf"/>
<text x="86" y="286" class="eyebrow" style="font-size:9px">LEVEL 2</text>
<text x="86" y="310" class="cap-label tag" style="font-size:12px">DELIVERY-PROCESS REUSE</text>
</g>
<g transform="rotate(-1.1 235 204)">
<rect x="70" y="166" width="330" height="76" rx="6" class="kf"/>
<text x="86" y="192" class="eyebrow" style="font-size:9px">LEVEL 3</text>
<text x="86" y="216" class="cap-label tag" style="font-size:12px">DECISION-MECHANISM REUSE</text>
</g>
<g transform="rotate(0.7 235 110)">
<rect x="70" y="72" width="330" height="76" rx="6" class="gate unlit" stroke-dasharray="6 5"/>
<text x="86" y="98" class="eyebrow" style="font-size:9px">LEVEL 4</text>
<text x="86" y="122" class="cap-label tag" style="font-size:12px">ORGANIZATIONAL RECOMPILATION</text>
</g>
<circle cx="436" cy="260" r="8" class="dot"/>
<text x="450" y="256" class="eyebrow" style="font-size:8px">WHERE RELIABLE</text>
<text x="450" y="268" class="eyebrow" style="font-size:8px">REUSE STOPS</text>
<text x="450" y="280" class="eyebrow" style="font-size:8px">TODAY</text>
<text x="32" y="460" class="cap-label" style="fill:#5F5B52">Level 4 is drawn unlit: not demonstrated as software by anyone, including the author.</text></svg>