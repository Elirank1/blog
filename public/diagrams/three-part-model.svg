<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Three parts, one each" style="width:100%;height:auto;background:#EFEBE1;border:1px solid #D0CABD;border-radius:6px"><style>
