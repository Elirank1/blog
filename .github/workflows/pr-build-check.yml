name: PR Build Check

# Safety-net workflow: runs the production build against every pull request
# so a broken build is caught before merge, without deploying anything.
# Deliberately separate from deploy.yml (which deploys on push to main) --
# this workflow never writes to Pages and has no deploy-related permissions.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
